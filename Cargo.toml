[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/market-types",
    "crates/chain-types",
    "crates/crypto-envelope",
    "crates/storage",
    "crates/telemetry",
    "crates/auth",
    "crates/policy",
    "crates/privy",
    "apps/edge-gateway",
    "apps/private-api",
    "apps/trading-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/quantm-zeus/private-execution-platform"

[workspace.dependencies]
# internal crates
domain = { path = "crates/domain" }
market-types = { path = "crates/market-types" }
chain-types = { path = "crates/chain-types" }
crypto-envelope = { path = "crates/crypto-envelope" }
storage = { path = "crates/storage" }
telemetry = { path = "crates/telemetry" }
auth = { path = "crates/auth" }
policy = { path = "crates/policy" }
privy = { path = "crates/privy" }

# async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / telemetry
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

[profile.release]
lto = "thin"
