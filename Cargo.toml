[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/market-types",
    "crates/chain-types",
    "crates/crypto-envelope",
    "crates/crypto-envelope-wasm",
    "crates/storage",
    "crates/telemetry",
    "crates/auth",
    "crates/policy",
    "crates/privy",
    "apps/edge-gateway",
    "crates/rpc-contracts",
    "crates/service-identity",
    "crates/rpc-mtls-proof",
    "apps/private-api",
    "apps/trading-core",
    "crates/mcp-adapters",
    "crates/provider-broker",
    "crates/simulation",
    "crates/tax-engine",
    "crates/routing",
    "crates/execution-preview",
    "crates/execution-relay",
    "crates/audit",
    "crates/limit-engine",
    "crates/agent-commands",
    "crates/mcp-server",
    "crates/agent-backend",
    "crates/telegram-bot",
    "crates/social-intel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/quantm-zeus/private-execution-platform"

[workspace.dependencies]
# internal crates
domain = { path = "crates/domain" }
rpc-contracts = { path = "crates/rpc-contracts" }
service-identity = { path = "crates/service-identity" }
rpc-mtls-proof = { path = "crates/rpc-mtls-proof" }
market-types = { path = "crates/market-types" }
chain-types = { path = "crates/chain-types" }
crypto-envelope = { path = "crates/crypto-envelope" }
storage = { path = "crates/storage" }
telemetry = { path = "crates/telemetry" }
auth = { path = "crates/auth" }
policy = { path = "crates/policy" }
privy = { path = "crates/privy" }
mcp-adapters = { path = "crates/mcp-adapters" }
provider-broker = { path = "crates/provider-broker" }
simulation = { path = "crates/simulation" }
tax-engine = { path = "crates/tax-engine" }
routing = { path = "crates/routing" }
execution-preview = { path = "crates/execution-preview" }
execution-relay = { path = "crates/execution-relay" }
audit = { path = "crates/audit" }
limit-engine = { path = "crates/limit-engine" }
agent-commands = { path = "crates/agent-commands" }
mcp-server = { path = "crates/mcp-server" }
agent-backend = { path = "crates/agent-backend" }
telegram-bot = { path = "crates/telegram-bot" }
social-intel = { path = "crates/social-intel" }

# async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / telemetry
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# web
axum = "0.8"

# internal RPC
prost = "=0.14.4"
tonic = { version = "=0.14.5", features = ["transport", "tls-ring"] }
tonic-prost = "=0.14.5"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

[profile.release]
lto = "thin"
