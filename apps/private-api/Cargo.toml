[package]
name = "private-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "private-api"
path = "src/main.rs"

[dependencies]
agent-commands.workspace = true
async-trait.workspace = true
auth.workspace = true
axum.workspace = true
crypto-envelope.workspace = true
getrandom = "0.2"
mcp-server.workspace = true
rpc-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
service-identity.workspace = true
session-transport.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
auth = { workspace = true, features = ["private-test-support"] }
http-body-util = "0.1"
rcgen = { version = "=0.14.5", features = ["x509-parser"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
