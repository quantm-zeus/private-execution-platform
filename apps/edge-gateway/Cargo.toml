[package]
name = "edge-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "edge-gateway"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rpc-contracts.workspace = true
service-identity.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "net"] }
tokio-stream = "0.1"
tonic.workspace = true
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
crypto-envelope.workspace = true
futures-util = "0.3"
http-body-util = "0.1"
private-api = { path = "../private-api" }
rcgen = { version = "=0.14.5", features = ["x509-parser"] }
serde_json.workspace = true
session-transport.workspace = true
tempfile = "3"
tokio-tungstenite = "0.29"
