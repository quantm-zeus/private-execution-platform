name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  web-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # verify:web-boundary shells out to the crypto-envelope CLI/wasm proofs,
      # so the boundary gate must have a pinned Rust toolchain available.
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm test:shell
      # Release/tooling gate: immutable manifest + atomic publish/rollback and
      # hardened shell cache headers. Also runs the production-faithful unlock
      # proof (real private-api loader + production-build-script artifact).
      - run: node --test scripts/workspace-release.test.mjs
      - run: pnpm verify:web-boundary
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:workspace-payload
      - run: pnpm build:workspace-shell
      # Audited HPKE responder + artifact tooling used by the shell-unlock spec.
      - run: cargo build -p crypto-envelope --bins --example test-session-host
      - run: pnpm --filter @evergreen/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @evergreen/e2e exec playwright test
