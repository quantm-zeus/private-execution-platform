name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  web-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # verify:web-boundary shells out to the crypto-envelope CLI/wasm proofs,
      # so the boundary gate must have a pinned Rust toolchain available.
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm test:shell
      # Release/tooling unit gate: immutable manifest, atomic publish/rollback
      # and hardened shell cache headers.
      - run: node --test scripts/workspace-release.test.mjs
      # The production-faithful unlock proof (real private-api loader +
      # production-build-script artifact through the real HPKE routes) runs
      # inside verify:web-boundary, not the unit test above.
      - run: pnpm verify:web-boundary
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:workspace-payload
      - run: pnpm build:workspace-shell
      # Audited HPKE responder + artifact tooling used by the shell-unlock spec.
      - run: cargo build -p crypto-envelope --bins --example test-session-host
      # Chromium is the reference engine (audited HPKE/WASM unlock path and the
      # WebAuthn harness). Firefox independently re-runs every surface in a
      # second layout/runtime engine; the shell mocks navigator.credentials and
      # reports an existing operator session, so the production-faithful unlock
      # host is exercised under both.
      - run: pnpm --filter @evergreen/e2e exec playwright install --with-deps chromium firefox
      - run: pnpm --filter @evergreen/e2e exec playwright test
